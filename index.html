<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plura | Painel Administrativo</title>
<link rel="icon" href="plura.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ─── HEADER ─────────────────────────────────────────── -->
<header>
  <div>
    <div class="header-eyebrow">Plano de Trabalho e gerenciamento do projeto</div>
    <div class="header-title">APP <span>PLURA</span> </div>
    <!-- <div class="header-meta">subtítulo 01&nbsp;·&nbsp; subtítulo 02</div> -->
  </div>
  <div style="display:flex; align-items:flex-start; gap:0.6rem;">
    <button class="theme-toggle" id="themeToggle" title="Alternar modo claro/escuro" aria-label="Alternar tema"></button>
    
  </div>
</header>

<!-- ─── LOGIN ──────────────────────────────────────────── -->
<div class="login-container">
  <div class="login-card">
    <div class="login-title">Acesso à Plataforma</div>
    <div class="login-subtitle">Entre com suas credenciais para continuar</div>

    <form id="loginForm" class="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-input" type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="input-wrapper">
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Visualizar senha"></button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="btn-login">Entrar</button>

      <div class="login-links">
        <!-- <a href="#" class="login-link" id="recoverLink">Recuperar senha</a> -->
        <a href="#" class="login-link" id="helpLink">Contatar ajuda</a>
      </div>
    </form>
  </div>
</div>

<!-- ─── FOOTER ──────────────────────────────────────────── -->
<footer>
  <span>Plataforma de Gerenciamento de projeto</span>
  <span>Criada por Master Educação LTDA.2026</span>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="login.js"></script>
</body>
</html>
